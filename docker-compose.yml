services:

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"   # PHP built-in server (php skim serve)
      - "5173:5173"   # Vite dev server
    volumes:
      - .:/app
      - vendor:/app/vendor       # persist vendor between rebuilds
      - node_modules:/app/node_modules
    environment:
      APP_DEBUG: "true"
      APP_ENV: "local"
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_NAME: "skim_dev"
      DB_USER: "skim"
      DB_PASS: "secret"
      ANALYTICS_DB_HOST: "pgsql"
      ANALYTICS_DB_PORT: "5432"
      ANALYTICS_DB_NAME: "skim_analytics"
      ANALYTICS_DB_USER: "skim"
      ANALYTICS_DB_PASS: "secret"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    depends_on:
      mysql:
        condition: service_healthy
      pgsql:
        condition: service_healthy
      redis:
        condition: service_started
    tty: true
    stdin_open: true

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: skim_dev
      MYSQL_USER: skim
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 12

  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skim_analytics
      POSTGRES_USER: skim
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skim -d skim_analytics"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  mysql_data:
  pgsql_data:
  redis_data:
  vendor:
  node_modules:
