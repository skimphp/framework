[PHP]
memory_limit         = 256M
max_execution_time   = 60
upload_max_filesize  = 64M
post_max_size        = 64M
error_reporting      = E_ALL
display_errors       = On
display_startup_errors = On
log_errors           = On

opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.revalidate_freq=0
opcache.validate_timestamps=1

[opcache]
opcache.enable              = 1
opcache.enable_cli          = 1
opcache.memory_consumption  = 128
opcache.max_accelerated_files = 10000
; validate_timestamps=1 + revalidate_freq=0 means every request checks mtime.
; Keeps opcache on (realistic perf) but picks up file changes instantly in dev.
opcache.validate_timestamps = 1
opcache.revalidate_freq     = 0

[pcov]
; pcov collects coverage only for files under pcov.directory.
; Set to /app/src so vendor/ isn't included in coverage reports.
pcov.enabled   = 1
pcov.directory = /app/src
