name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ["8.4", "8.5"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, pdo_mysql, redis, mbstring, pcntl, intl
          coverage: pcov

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests with coverage
        run: ./vendor/bin/pest --coverage --min=80
        env:
          APP_DEBUG: "true"
          CACHE_DRIVER: array
          DB_DRIVER: sqlite

      - name: Check llm.md is up to date
        run: |
          HASH_COMMITTED=$(sha256sum llm.md 2>/dev/null | cut -d' ' -f1 || echo "missing")
          php skim docs:extract
          php skim docs:llm
          HASH_GENERATED=$(sha256sum llm.md | cut -d' ' -f1)
          if [ "$HASH_COMMITTED" != "$HASH_GENERATED" ]; then
            echo "llm.md is stale — run 'php skim docs' locally and commit the result."
            exit 1
          fi
        env:
          APP_ENV: development
